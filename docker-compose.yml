services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_researcher
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_researcher"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      # Database and Redis URLs pointing to the internal docker network services
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ai_researcher
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      # Allow frontend to access the API (3000 mapped to frontend, 80 default, and standard React 5173/3000)
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Expose Node static server on port 3000 
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
